<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sick Call — 68W ADTMC Tool</title>
<meta name="theme-color" content="#000000">
<script>try{var _s=JSON.parse(localStorage.getItem("sc_settings")||"{}"),_r=document.documentElement;if(_s.theme&&_s.theme!=="green")_r.setAttribute("data-theme",_s.theme);if(_s.mode==="light")_r.setAttribute("data-mode","light");}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Sick Call">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header>
  <span class="brand">Sick Call</span><span class="langsw"><button id="lEN" onclick="setLang('en')" title="English">EN</button><button id="lES" onclick="setLang('es')" title="Español">ES</button></span><span class="sub">68W · ADTMC (MEDCOM Pam 40-7-21) — tap options, the note builds itself</span>
  <span class="spacer"></span>
  <button id="instBtn" class="inst-btn" onclick="installApp()" style="display:none" title="Add to Home Screen">📲 Install</button>
  <button onclick="setFs(-1)" title="smaller text">A−</button>
  <button onclick="setFs(1)" title="larger text">A+</button>
  <button onclick="resetTpl()">Clear section</button>
  <button class="danger" onclick="clearAllAsk(this)" title="Clears everything and starts a new case">Clear all</button>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<aside id="aside">
  <div id="peek" onclick="sheetTog()"><div class="grab"></div><div class="pk-row"><div class="pk-t"><b id="pkT">Note</b><span id="pkS">Tap options — the note builds itself</span></div><button class="pk-copy" onclick="event.stopPropagation();copyNote(this)">Copy</button><button class="xbtn pk-x" onclick="event.stopPropagation();sheetTog(false)" aria-label="Close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
  <div class="out-head">
    <span class="t">Note (transcribe to slip)</span>
    <span class="spacer"></span>
    <button class="ghost" id="editBtn" onclick="toggleEdit()" title="Edit the note by hand before copying">✏️ Edit</button>
    <button class="ghost" id="autoBtn" onclick="setNoteMode('auto')" style="display:none" title="Discard manual edits and rebuild the note from your answers">↺ Auto</button>
    <button class="ghost" onclick="copyNote(this)">Copy</button>
    <button class="ghost" id="fmtBtn" onclick="toggleFmt()" title="Note format: compact or SOAP-D (ADTMC Appendix D)">SOAP-D</button>
    <details class="menu" id="moreMenu"><summary class="ghost">⋯ More</summary>
      <div class="menu-list">
        <button onclick="exportNote();menuClose()" title="Download as .txt">⬇ Download .txt</button>
        <button onclick="printNote();menuClose()" title="Print / PDF">🖨 Print note</button>
        <button onclick="daOpen();menuClose()" title="Open DA Form 5181 (Screening Note of Acute Medical Care), prefilled, to print">📄 DA Form 5181</button>
        <button onclick="slipOpen();menuClose()" title="Open the DD Form 689 sick slip, prefilled, to print">📄 DD Form 689</button>
      </div>
    </details>
  </div>
  <div id="notebanner" class="note-hint" style="display:none;margin:0;border-radius:0"></div>
  <div class="pt-row">
    <input id="ptIn" type="text" placeholder="Soldier (Rank Last name) — optional" oninput="patient=this.value;renderNote()">
    <button onclick="savePatient(this)" title="Saves this note and clears everything for the next Soldier">Save ➜ next</button>
  </div>
  <div id="multiWarn" style="display:none"></div>
  <div id="piiWarn" style="display:none"></div>
  <div id="note"></div>
</aside>
</div>
<nav id="tabbar"><button data-v="adtmc" onclick="tabGo('adtmc')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v3H4zm0 5.5h16v3H4zM4 16h10v3H4z"/></svg><span>Protocols</span></button><button data-v="admeds" onclick="tabGo('admeds')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 3.5a5.1 5.1 0 0 1 3.6 1.5l6.8 6.8a5.1 5.1 0 0 1-7.2 7.2L5 12.2a5.1 5.1 0 0 1 3.6-8.7zm-2.2 7.3 3.8 3.8 4.4-4.4-3.8-3.8a3.1 3.1 0 0 0-4.4 4.4z"/></svg><span>Meds</span></button><button data-v="mace" onclick="tabGo('mace')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a7 7 0 0 0-4 12.7V18h8v-2.8a7 7 0 0 0-4-12.7zM9 19.5h6V21H9z"/></svg><span>MACE</span></button><button data-v="guardados" onclick="tabGo('guardados')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Saved</span></button><button data-v="more" onclick="tabGo('more')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg><span>More</span></button></nav>
<button id="mobileNoteBtn" onclick="document.getElementById('aside').classList.toggle('open')">View note</button>

<div id="lock"><div style="font-size:2em">🔒</div><div>Sick Call locked</div><input id="pinIn" type="password" inputmode="numeric" maxlength="8" onkeydown="if(event.key==='Enter')tryUnlock()"><div id="pinMsg" style="color:var(--red);min-height:1.2em"></div><button onclick="tryUnlock()">Unlock</button></div>
<script src="data/protocols.js"></script>
<script src="data/meds.js"></script>
<script src="data/plans.js"></script>
<script src="data/notetags.js"></script>
<script src="data/howto.js"></script>
<script src="data/intake.js"></script>
<script src="data/es.js"></script>
<script src="data/access.js"></script>
<script src="data/medinfo.js"></script>
<script src="data/pfb.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="app.js"></script>
<script src="access.js"></script>
</body>
</html>
