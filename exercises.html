<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My PT Program</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My PT">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<!-- Soldier-facing page: opened by scanning the QR on the medic's phone. No patient data — only body area + language in the URL.
     Página para el soldado: se abre escaneando el QR del teléfono del médico. Sin datos del paciente — solo la zona y el idioma en la URL. -->
<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--card2:#E9E9EE;--txt:#000;--dim:#6C6C70;--acc:#FF9500;--acc-t:#000;--red:#FF3B30;--green:#34C759;--line:#E5E5EA}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--txt:#fff;--dim:#8E8E93;--acc:#FF9F0A;--red:#FF453A;--green:#30D158;--line:#38383A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.top b{font-size:16px;color:var(--dim)}
.lang{margin-left:auto;display:flex;background:var(--card2);border-radius:9px;padding:2px}
.lang button{border:0;background:none;color:var(--dim);font-family:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:7px}
.lang button.on{background:var(--acc);color:var(--acc-t)}
h1{font-size:28px;line-height:1.15;margin:8px 0 6px}
p.sub{color:var(--dim);margin:0 0 14px}
.prog{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.prog .row{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;background:var(--card2);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .25s}
.days{color:var(--dim);font-size:14px;margin-top:6px}
.why{background:var(--card);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:15px}
.rules{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 6px;font-size:15px}
.rules b{display:block;margin-bottom:4px}
.rules li{margin:4px 0}.rules ul{margin:0;padding-left:20px}
.grp{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 8px;display:flex;justify-content:space-between;gap:8px}
.grp span:last-child{text-transform:none;letter-spacing:0}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.ex{display:flex;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--dim);background:none;color:transparent;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ex.done .ck{background:var(--green);border-color:var(--green);color:#fff}
.ex.done .nm{text-decoration:line-through;opacity:.6}
.bd{flex:1;min-width:0}
.nm{font-weight:600}
.ds{color:var(--acc);font-size:15px;font-weight:600;margin-top:1px}
.cue{color:var(--dim);font-size:15px;margin-top:3px}
.tm{margin-top:7px;border:0;background:var(--card2);color:var(--txt);font-family:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:16px}
.tm.run{background:var(--acc);color:var(--acc-t)}
.more{display:block;text-align:center;background:var(--card);border-radius:14px;padding:14px;margin-top:16px;color:var(--acc);text-decoration:none;font-weight:600}
.foot{color:var(--dim);font-size:13px;margin-top:16px;line-height:1.45}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.xa{--xa-bg:var(--card2);--xa-b:var(--txt);--xa-f:var(--dim);--xa-h:var(--acc);display:block;width:100%;max-width:300px;height:auto;background:var(--xa-bg);border-radius:10px;margin:0 0 8px}
.fig{display:block;width:100%;height:auto;border-radius:8px;margin:8px 0 2px;background:#fff}
.pg{color:var(--dim);font-size:13px}
details.mod{margin-top:6px}details.mod summary{color:var(--acc);font-weight:600;font-size:15px;cursor:pointer}
.lvl{display:flex;gap:6px;margin:4px 0 10px}.lvl button{flex:1;border:0;border-radius:10px;padding:10px 6px;font:600 14px inherit;font-family:inherit;background:var(--card2);color:var(--txt)}.lvl button.on{background:var(--acc);color:var(--acc-t)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.week div{background:var(--card);border-radius:10px;padding:6px 3px;display:flex;flex-direction:column;gap:3px;text-align:center;font-size:12px}.week div.today{outline:2px solid var(--acc)}.week span{background:var(--card2);border-radius:5px;padding:2px}
.w2r{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.w2r button{border:0;border-radius:10px;padding:8px;background:var(--card);color:var(--txt);font:13px inherit;font-family:inherit;text-align:left}.w2r button.on{outline:2px solid var(--acc)}
.inst{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:12px 14px;margin:6px 0 10px;font-size:15px}.inst>b{display:block;margin-bottom:4px}.inst .x{margin-top:8px;border:0;border-radius:8px;padding:7px 14px;background:var(--acc);color:var(--acc-t);font:600 14px inherit;font-family:inherit}
.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.pd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim)}.pd.today span{color:var(--acc);font-weight:700}.pd i{display:block;width:100%;height:28px;border-radius:6px;background:linear-gradient(to top,var(--green) var(--p),var(--card2) var(--p))}.pd i.off{opacity:.35}
.pick a{background:var(--card);color:var(--txt);text-decoration:none;padding:12px 16px;border-radius:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data/exercises.js"></script>
<script>
(function(){
var qs=new URLSearchParams(location.search);
try{if(!qs.get('r')){var last=localStorage.getItem('ex_last');if(last){qs=new URLSearchParams(last);history.replaceState(null,'','?'+last);}}else localStorage.setItem('ex_last',location.search.slice(1));}catch(e){}
var reg=qs.get('r')||'';
var lvl=qs.get('s')==='2'?2:1;
var lang=(qs.get('l')||(navigator.language||'en')).slice(0,2)==='es'?'es':'en';
function L(en,es){return lang==='es'?es:en;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
var KEY='ex_'+reg;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
var st=load();if(!st.days)st.days={};if(!st.crit)st.crit={};if(!st.log)st.log={};if(!st.start)st.start=today();if(st.lvl&&!qs.get('s'))lvl=st.lvl;
function doneSet(){return st.days[today()]||[];}
var timer=null;
function url(){var u='r='+reg+'&s='+lvl+'&l='+lang;try{localStorage.setItem('ex_last',u);}catch(e){}return '?'+u;}
function hhmm(){var d=new Date();return ('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2);}
function standalone(){try{return window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;}catch(e){return false;}}
function plat(){var u=navigator.userAgent||'';if(/iPhone|iPad|iPod/.test(u)||(/Macintosh/.test(u)&&'ontouchend' in document))return 'ios';if(/Android/.test(u))return 'android';return 'other';}
function dkey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function secs(d){if(/\b1 minute\b/.test(d))return 60;var all=String(d).match(/(\d+)\s*[–-]\s*(\d+)\s*(s|min)\b/);if(all)return all[3]==='min'?0:+all[2];var m=String(d).match(/(\d+)\s*s\b/);return m?+m[1]:0;}
function itemHtml(x,key,ds,rec){var dn=ds.indexOf(key)>=0,d=L(x.d,x.ds||x.d),s=secs(x.d);
  var tm=(st.log[today()]||{})[key];return '<div class="ex'+(dn?' done':'')+'"><button class="ck" data-k="'+key+'" aria-label="done">✓</button><div class="bd"><div class="nm">'+esc(L(x.n,x.es||x.n))+'</div><div class="ds">'+esc(d)+(dn&&tm?' <span class="pg">· ✓ '+tm.slice(0,2)+':'+tm.slice(2)+'</span>':'')+'</div>'
   +(x.img?'<img class="fig" src="'+EX_IMG+x.img+'.jpg" alt="'+esc(x.n)+'" loading="lazy">':'')+'<div class="cue">'+esc(L(x.c,x.cs))+' <span class="pg">(FM 7-22, p. '+x.pg+')</span></div>'
   +(x.mod?'<details class="mod"'+(rec?' open':'')+'><summary>'+(rec?'★ ':'')+L('Modified version','Versión modificada')+'</summary>'+(x.mn?'<div class="cue">'+esc(L(x.mn,x.ms))+'</div>':'')+'<img class="fig" src="'+EX_IMG+x.mod+'.jpg" alt="modified" loading="lazy"></details>':'')
   +(s?'<button class="tm" data-s="'+s+'">⏱ '+s+' s</button>':'')+'</div></div>';}
function render(){
  var app=document.getElementById('app');
  var top='<div class="top"><b>🏋️ '+L('Sick Call · Reconditioning (FM 7-22)','Sick Call · Reacondicionamiento (FM 7-22)')+'</b><div class="lang"><button class="'+(lang==='en'?'on':'')+'" data-l="en">EN</button><button class="'+(lang==='es'?'on':'')+'" data-l="es">ES</button></div></div>';
  if(typeof EX_REG==='undefined'||!EX_REG[reg]){
    app.innerHTML=top+'<h1>'+L('Pick your area','Escoge tu zona')+'</h1><div class="pick">'+Object.keys(EX_REG||{}).map(function(k){var r=EX_REG[k];return '<a href="?r='+k+'&s='+lvl+'&l='+lang+'">'+r.ic+' '+esc(L(r.t[0],r.t[1]))+'</a>';}).join('')+'</div>';
    bindLang();return;}
  var r=EX_REG[reg],S=EX_STAGES[lvl],wd=new Date().getDay(),weekend=(wd===0||wd===6),day=weekend?5:wd,toks=exTokens(reg,lvl,day),ds=doneSet();
  var items=[];toks.forEach(function(t){var D=EX_DRILLS[t];if(D)D.ex.forEach(function(x){items.push({k:x.id,x:x,g:t});});else items.push({k:t,x:exActById(t),g:'act'});});
  var n=items.filter(function(i){return ds.indexOf(i.k)>=0;}).length,nd=Object.keys(st.days).filter(function(k){return (st.days[k]||[]).length;}).length;
  var h=top;
  if(!standalone()&&!st.hideInstall){var p=plat();
    h+='<div class="inst"><b>📲 '+L('Save this program to your home screen','Guarda este programa en tu pantalla principal')+'</b><div>'
     +(p==='ios'?L('Open it in <b>Safari</b> → tap <b>Share</b> (square with the arrow ⬆️) → <b>Add to Home Screen</b> → <b>Add</b>.','Ábrelo en <b>Safari</b> → toca <b>Compartir</b> (el cuadro con la flecha ⬆️) → <b>Agregar a pantalla de inicio</b> → <b>Agregar</b>.')
      :p==='android'?L('In <b>Chrome</b> tap the <b>⋮</b> menu (top right) → <b>Add to Home screen</b> (or <b>Install app</b>) → <b>Add</b>.','En <b>Chrome</b> toca el menú <b>⋮</b> (arriba a la derecha) → <b>Agregar a la pantalla principal</b> (o <b>Instalar app</b>) → <b>Agregar</b>.')
      :L('iPhone: Safari → Share ⬆️ → Add to Home Screen. Android: Chrome → ⋮ → Add to Home screen.','iPhone: Safari → Compartir ⬆️ → Agregar a pantalla de inicio. Android: Chrome → ⋮ → Agregar a la pantalla principal.'))
     +' '+L('The "My PT" icon opens your program, even without signal.','El ícono "My PT" abre tu programa, incluso sin señal.')+'</div><button class="x" id="instx">'+L('Got it','Entendido')+'</button></div>';}
  h+='<h1>'+r.ic+' '+esc(L(r.t[0],r.t[1]))+'</h1>';
  h+='<div class="lvl">'+[1,2].map(function(x){return '<button class="'+(x===lvl?'on':'')+'" data-v="'+x+'">'+esc(L(EX_STAGES[x].t[0],EX_STAGES[x].t[1]))+'</button>';}).join('')+'</div>';
  h+='<p class="sub">'+esc(L(S.who[0],S.who[1]))+' '+L('Your profile always comes first.','Tu profile siempre va primero.')+'</p>';
  h+='<div class="prog"><div class="row"><span>'+(weekend?L('Weekend — repeat Friday or rest','Fin de semana — repite el viernes o descansa'):L('Today','Hoy')+' · '+L(EX_DAYS[wd][0],EX_DAYS[wd][1]))+'</span><span>'+n+' / '+items.length+'</span></div><div class="bar"><i style="width:'+(items.length?Math.round(100*n/items.length):0)+'%"></i></div><div class="days">'+L('Days with exercises done: ','Días con ejercicios hechos: ')+nd+'</div></div>';
  h+='<div class="why">'+esc(lvl===2&&r.l2?L(r.l2[0],r.l2[1]):L(r.why[0],r.why[1]))+'</div>';
  // today's session, in FM order
  var seen={};toks.forEach(function(t){if(seen[t])return;seen[t]=1;var D=EX_DRILLS[t],list=items.filter(function(i){return i.g===t||(i.g==='act'&&i.k===t);});
    var title=D?L(D.n,D.es):L(list[0].x.n,list[0].x.es),when=D?L(D.when[0],D.when[1]):'';
    h+='<div class="grp"><span>'+esc(title)+'</span><span>'+esc(when)+'</span></div><div class="list">'+list.map(function(it){return itemHtml(it.x,it.k,ds,(r.mods||[]).indexOf(it.k)>=0||(lvl===1&&t==='PD'));}).join('')+'</div>';
    if(t==='w2r'){var wk=st.w2r||1;h+='<div class="w2r">'+[1,2,3,4,5].map(function(w){var row=EX_W2R[w-1];return '<button class="'+(w===wk?'on':'')+'" data-w="'+w+'"><b>'+L('Week ','Semana ')+w+'</b><br>'+(row?L('walk ','camina ')+row[0]+' · '+L('jog ','trota ')+row[1]+' min ×'+row[2]:L('run 15 → 30 min','corre 15 → 30 min'))+'</button>';}).join('')+'</div><div class="foot" style="margin-top:6px">'+esc(L(EX_W2R_NOTE[0],EX_W2R_NOTE[1]))+'</div>';}
  });
  // progress: last 14 days; each check saved with its time; only today can be marked
  (function(){var cells='',done=0,full=0,streak=0;for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dkey(d),wdd=d.getDay(),c=(st.days[k]||[]).length,need=(wdd===0||wdd===6)?0:exTokens(reg,lvl,wdd).reduce(function(a,t){return a+(EX_DRILLS[t]?EX_DRILLS[t].ex.length:1);},0);
      var pct=need?Math.min(100,Math.round(100*c/need)):(c?100:-1);if(c)done++;if(pct>=100)full++;
      cells+='<div class="pd'+(i===0?' today':'')+'" title="'+k+'"><span>'+L(EX_DAYS[wdd][0],EX_DAYS[wdd][1]).slice(0,2)+'</span><i style="--p:'+(pct<0?0:pct)+'%" class="'+(pct<0?'off':'')+'"></i><small>'+(pct<0?'—':pct+'%')+'</small></div>';}
    for(var j=0;j<60;j++){var d2=new Date();d2.setDate(d2.getDate()-j);var w2=d2.getDay();if(w2===0||w2===6)continue;var c2=(st.days[dkey(d2)]||[]).length;if(j===0&&!c2)continue;if(c2)streak++;else break;}
    h+='<div class="grp"><span>'+L('My progress — last 14 days','Mi progreso — últimos 14 días')+'</span><span>'+L('Started ','Empecé ')+esc(st.start)+'</span></div><div class="prog"><div class="pgrid">'+cells+'</div><div class="days">'+L('Days with exercise: ','Días con ejercicio: ')+done+' · '+L('Full sessions: ','Sesiones completas: ')+full+' · '+L('Training-day streak: ','Racha de días de entrenamiento: ')+streak+'</div><div class="foot" style="margin-top:6px">'+L('Each check is saved with the time you marked it, and only today can be marked. Show this screen at your follow-up — your medic or RPL confirms your progress with the FM 7-22 tests in person.','Cada marca se guarda con la hora en que la hiciste, y solo se puede marcar el día de hoy. Enseña esta pantalla en tu seguimiento — tu medic o RPL confirma tu progreso con las pruebas del FM 7-22 en persona.')+'</div></div>';})();
  // week overview
  h+='<div class="grp"><span>'+L('This week','Esta semana')+'</span><span>FM 7-22 '+(lvl===1?L('Table 6-1','Tabla 6-1'):L('Table 6-3','Tabla 6-3'))+'</span></div><div class="week">'+[1,2,3,4,5].map(function(d){return '<div class="'+(d===wd?'today':'')+'"><b>'+L(EX_DAYS[d][0],EX_DAYS[d][1])+'</b>'+exTokens(reg,lvl,d).map(function(t){var D=EX_DRILLS[t];if(D)return '<span>'+t+'</span>';var a=exActById(t);return '<span>'+esc(L(a.sh[0],a.sh[1]))+'</span>';}).join('')+'</div>';}).join('')+'</div>';
  // next level criteria (self-check)
  h+='<div class="grp"><span>'+esc(L(S.next.t[0],S.next.t[1]))+'</span><span></span></div><div class="list">'+S.next.c.map(function(c,i){var k=lvl+'_'+i,on=!!st.crit[k];return '<div class="ex'+(on?' done':'')+'"><button class="ck cr" data-c="'+k+'">✓</button><div class="bd"><div class="nm">'+esc(L(c[0],c[1]))+'</div><div class="ds">'+esc(L(c[2],c[3]))+'</div></div></div>';}).join('')+'</div><div class="foot">'+esc(L(S.next.f[0],S.next.f[1]))+' '+L('Show this to your medic or RPL — they decide when you move up.','Enséñaselo a tu medic o RPL — ellos deciden cuándo subes de nivel.')+'</div>';
  h+='<div class="rules"><b>⚠️ '+L('Rules','Reglas')+'</b><ul>'+EX_RULES[lang].map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="foot">'+L('From your unit sick call. Not a substitute for medical care — your profile always comes first. Source: ','De tu sick call de la unidad. No reemplaza la atención médica — tu profile siempre va primero. Fuente: ')+esc(EX_SRC)+'. '+L('Your check marks stay only on this phone.','Tus marcas se guardan solo en este teléfono.')+'</div>';
  app.innerHTML=h;bindLang();
  Array.prototype.forEach.call(document.querySelectorAll('.ck:not(.cr)'),function(b){b.onclick=function(){var k=b.getAttribute('data-k'),t=today(),a=st.days[t]||[];var i=a.indexOf(k);if(!st.log[t])st.log[t]={};if(i>=0){a.splice(i,1);delete st.log[t][k];}else{a.push(k);st.log[t][k]=hhmm();}st.days[t]=a;save(st);render();};});
  var ix=document.getElementById('instx');if(ix)ix.onclick=function(){st.hideInstall=true;save(st);render();};
  Array.prototype.forEach.call(document.querySelectorAll('.ck.cr'),function(b){b.onclick=function(){var k=b.getAttribute('data-c');st.crit[k]=!st.crit[k];save(st);render();};});
  Array.prototype.forEach.call(document.querySelectorAll('.lvl button'),function(b){b.onclick=function(){lvl=+b.getAttribute('data-v');st.lvl=lvl;save(st);try{history.replaceState(null,'',url());}catch(e){}render();window.scrollTo(0,0);};});
  Array.prototype.forEach.call(document.querySelectorAll('.w2r button'),function(b){b.onclick=function(){st.w2r=+b.getAttribute('data-w');save(st);render();};});
  Array.prototype.forEach.call(document.querySelectorAll('.tm'),function(b){b.onclick=function(){var s=+b.getAttribute('data-s');if(timer){clearInterval(timer.id);if(timer.b===b){timer.b.textContent='⏱ '+s+' s';timer.b.classList.remove('run');timer=null;return;}timer.b.classList.remove('run');timer.b.textContent='⏱ '+timer.s+' s';}
    var left=s;b.classList.add('run');b.textContent='⏱ '+left;timer={b:b,s:s,id:setInterval(function(){left--;if(left<=0){clearInterval(timer.id);b.classList.remove('run');b.textContent='✅ '+L('Done','Listo');try{navigator.vibrate&&navigator.vibrate(300);}catch(e){}timer=null;return;}b.textContent='⏱ '+left;},1000)};};});
}
function bindLang(){Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){b.onclick=function(){lang=b.getAttribute('data-l');document.documentElement.lang=lang;try{history.replaceState(null,'',url());}catch(e){}render();};});}
document.documentElement.lang=lang;render();
})();
</script>
</body>
</html>
